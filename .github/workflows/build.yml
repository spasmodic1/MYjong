name: Build and release MYjong
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:models
      - run: npm run test:imports
      - run: npm run test:collection
      - run: npm run test:phone
      - run: npm run test:personalization
      - run: npm run test:race
      - run: npm run test:loss
      - run: npm run test:scores
      - run: npm run test:memory
      - run: npm run test:layouts
      - run: npm run test:seasonal
      - run: node --test e2e/rabbit.test.cjs
      - run: node --test e2e/startup-update.test.cjs
      - name: Check for an existing published release
        id: existing
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release-exists.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || steps.existing.outputs.published == 'true' }}
      - run: npm run release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.existing.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: MYjong-Windows
          path: |
            dist/MYjong-Setup-*.exe
            dist/*.blockmap
            dist/latest.yml
